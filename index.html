    <script>
      // GitHub Pages SPA redirect: 404.html sends unknown deep links here as ?p=/path, restore the real URL
      (function(l) {
        if (l.search[1] === '?p='.charAt(2) || l.search.indexOf('?p=/') === 0) {
          var decoded = l.search.slice(1).split('&').reduce(function(q, v) {
            var a = v.split('=');
            if (a[0] === 'p') q.path = '/' + a[1];
            if (a[0] === 'q') q.query = '?' + a[1];
            return q;
          }, { path: '', query: '' });
          window.history.replaceState(null, null,
            l.pathname.split('/').slice(0, 2).join('/') +
            decoded.path.replace(/~and~/g, '&') +
            decoded.query.replace(/~and~/g, '&') +
            l.hash
          );
        }
      }(window.location));
    </script>
